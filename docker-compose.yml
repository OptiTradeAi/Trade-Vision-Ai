version: "3.9"
services:
  api:
    build: ./api
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    restart: unless-stopped
  engine:
    build: ./api
    command: bash -lc "python -m app.engine.runner"
    env_file:
      - .env
    depends_on:
      - api
      - db
      - redis
    restart: unless-stopped
  web:
    build: ./web
    env_file:
      - .env
    ports:
      - "5173:5173"
    depends_on:
      - api
    restart: unless-stopped
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tv
      POSTGRES_PASSWORD: tvpass
      POSTGRES_DB: tradevision
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
volumes:
  db_data:
